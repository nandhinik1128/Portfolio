<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills | Nandhini</title>
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/skills.css">
</head>
<body class="skills-body">
    <div class="top">
        <div class="logo"><img src="../assets/images/logo.png" width="150" alt="Nandhini portfolio logo"></div>
        <div class="navbar">
            <nav aria-label="Primary navigation">
                <a href="../index.html">HOME</a>
                <a href="about.html">ABOUT</a>
                <a href="contact.html">CONTACT</a>
                <a href="skills.html" aria-current="page">SKILLS</a>
                <a href="project.html">PROJECT</a>
            </nav>
        </div>
    </div>
    <main class="skills-page">
        <section class="skills-intro" aria-labelledby="skills-title">
            <p class="eyebrow">MY TOOLKIT</p>
            <h1 id="skills-title">Skills</h1>
            <p>Technologies I use to build, learn and experiment.</p>
        </section>
        <section class="globe-section" aria-label="Interactive skills globe">
            <div class="globe-wrap">
                <canvas id="skills-globe" tabindex="0" aria-label="Rotating globe of Nandhini's technology skills"></canvas>
                <div class="globe-core" aria-hidden="true">N</div>
            </div>
            <aside class="skill-detail" aria-live="polite">
                <p class="detail-category">SELECT A NODE</p>
                <h2 id="skill-name">Explore the globe</h2>
                <p id="skill-description">Hover or focus a skill to see how I use it.</p>
            </aside>
        </section>
        <section class="skill-levels" aria-labelledby="levels-title">
            <h2 id="levels-title">My current level</h2>
            <div id="skill-level-list"></div>
        </section>
        <p class="globe-hint">Move across the nodes to explore the toolkit</p>
    </main>
    <script src="../data/skills.js"></script>
    <script src="../js/skills.js"></script>
</body>
