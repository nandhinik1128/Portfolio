<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/home.css">

<body>
    <header class="site-header">
        <a class="site-logo" href="../index.html"><img src="../assets/images/logo.png" width="150" alt="Nandhini portfolio logo"></a>
        <nav class="site-nav" aria-label="Primary navigation">
            <a href="../index.html">HOME</a>

            <a href="skills.html">SKILLS</a>

    <main class="contact" style="max-width: 760px; margin: 5rem auto; text-align: center;">
        <h1>Contact Me</h1>
        <p>Feel free to reach out to me for collaboration or any queries.</p>
        <form style="margin: 2rem auto; width: min(100%, 420px); height: auto;">
            <label for="name">Your name</label>
            <input class="con" id="name" type="text" placeholder="Your name" required>
            <label for="email">Your email</label>
            <input class="con" id="email" type="email" placeholder="Your email" required>
            <label for="message">Your message</label>
            <textarea class="con" id="message" placeholder="Your message" required></textarea>
            <button class="btn" type="submit">Send message</button>
        </form>
    </main>
</body>
